[workspace]
resolver = "2"
members = [
    "auth-plugin",
    "tab-plugin",
    "menu-plugin",
    "template-plugin",
    "kronos-essentials",
    "kronos-ranks",
    "kronos-economy",
    "kronos-warps",
    "kronos-chat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
strip = true
